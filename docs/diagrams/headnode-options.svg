<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="1040" height="680" fill="#ffffff" rx="8"/>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/></marker></defs>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1e293b">BCM head-node topologies — four options</text>
<text x="24" y="56" font-size="12" fill="#64748b">One VM on Proxmox is the standard. The others exist for labs, policy, or legacy reasons.</text>
<rect x="40" y="88" width="480" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="120" font-size="15" font-weight="700" fill="#1e293b">Single baremetal head node</text>
<rect x="396" y="102" width="104" height="24" rx="12" fill="#f8fafc" stroke="#f8fafc"/>
<text x="448" y="118" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">SIMPLEST</text>
<rect x="190" y="144" width="180" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="280.0" y="175.5" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">BCM head node</text>
<text x="280.0" y="192.5" font-size="11" fill="#64748b" text-anchor="middle">baremetal</text>
<text x="60" y="284" font-size="12" fill="#64748b">• No HA — rebuild from backup on failure</text>
<text x="60" y="306" font-size="12" fill="#64748b">• Smallest BOM · fine for labs and small sites</text>
<text x="60" y="328" font-size="12" fill="#64748b">• §02 head-node install</text>
<rect x="560" y="88" width="480" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580" y="120" font-size="15" font-weight="700" fill="#1e293b">BCM HA — 2× baremetal</text>
<rect x="916" y="102" width="104" height="24" rx="12" fill="#fef3c7" stroke="#fef3c7"/>
<text x="968" y="118" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">CLASSIC</text>
<rect x="600" y="144" width="150" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="675.0" y="175.5" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">head-1</text>
<text x="675.0" y="192.5" font-size="11" fill="#64748b" text-anchor="middle">primary</text>
<rect x="850" y="144" width="150" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="925.0" y="175.5" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">head-2</text>
<text x="925.0" y="192.5" font-size="11" fill="#64748b" text-anchor="middle">standby</text>
<rect x="750" y="236" width="100" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="800.0" y="254.0" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">quorum disk</text>
<line x1="675" y1="220" x2="780" y2="236" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="925" y1="220" x2="820" y2="236" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="580" y="284" font-size="12" fill="#64748b">• cmha-setup · §13</text>
<text x="580" y="306" font-size="12" fill="#64748b">• Needs external quorum disk (not always available)</text>
<text x="580" y="328" font-size="12" fill="#64748b">• MySQL replication sync + cmsh timing quirks</text>
<rect x="40" y="380" width="480" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="412" font-size="15" font-weight="700" fill="#1e293b">BCM HA — 2× VMs on Proxmox</text>
<rect x="396" y="394" width="104" height="24" rx="12" fill="#f8fafc" stroke="#f8fafc"/>
<text x="448" y="410" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">RARE</text>
<rect x="110" y="428" width="340" height="128" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="280" y="448" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">Proxmox</text>
<rect x="130" y="460" width="145" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="202.5" y="491.5" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">VM: head-1</text>
<text x="202.5" y="508.5" font-size="11" fill="#64748b" text-anchor="middle">BCM HA</text>
<rect x="285" y="460" width="145" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="357.5" y="491.5" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">VM: head-2</text>
<text x="357.5" y="508.5" font-size="11" fill="#64748b" text-anchor="middle">BCM HA</text>
<text x="60" y="576" font-size="12" fill="#64748b">• HA inside the VMs and underneath them</text>
<text x="60" y="598" font-size="12" fill="#64748b">• Least common — double the moving parts</text>
<text x="60" y="620" font-size="12" fill="#64748b">• Only when policy demands both layers</text>
<rect x="560" y="380" width="480" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580" y="412" font-size="15" font-weight="700" fill="#1e293b">Single VM on Proxmox</text>
<rect x="916" y="394" width="104" height="24" rx="12" fill="#7c3aed" stroke="#7c3aed"/>
<text x="968" y="410" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ STANDARD</text>
<rect x="630" y="428" width="340" height="128" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="800" y="448" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">Proxmox cluster · HA</text>
<rect x="710" y="460" width="180" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="800.0" y="491.5" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">VM: BCM head node</text>
<text x="800.0" y="508.5" font-size="11" fill="#64748b" text-anchor="middle">snapshots anytime</text>
<polyline points="960,498 988,498 988,440 908,440" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="996" y="476" font-size="11" fill="#0d9488" text-anchor="middle">hypervisor</text>
<text x="996" y="490" font-size="11" fill="#0d9488" text-anchor="middle">failover</text>
<text x="580" y="576" font-size="12" fill="#64748b">• Snapshots pre / post / mid-config in BCM</text>
<text x="580" y="598" font-size="12" fill="#64748b">• No CMHA · no MySQL replication · no quorum disk</text>
<text x="580" y="620" font-size="12" fill="#64748b">• Failover handled by Proxmox HA</text>
</svg>